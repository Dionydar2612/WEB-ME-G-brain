name: sync-pokemon-news
# ตรวจข่าวจาก Pokémon Card Game Asia ทุก 30 นาที (ช่วงเวลาที่ปรับได้จริงตั้งในหน้า Admin: scraper ข้ามรอบถ้ายังไม่ถึงเวลา)
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
concurrency: {group: sync-pokemon-news, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: scraper/package-lock.json}
      - run: npm ci --prefix scraper
      - run: node scraper/index.js ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'anthropic' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ALLOW_SOURCE_IMAGES: ${{ vars.ALLOW_SOURCE_IMAGES || 'false' }}
          STORE_CONTENT: ${{ vars.STORE_CONTENT || 'false' }}
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
