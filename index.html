button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bd);margin-left:6px}.badge.a{background:#f59e0b;color:#fff}

.row.end{justify-content:flex-end}.row.two>*{flex:1;min-width:0}.wide{width:100%;padding:12px;margin:8px 0}.soft{background:var(--bd);color:var(--tx)}

.tbar{display:flex;gap:2px;margin:8px 0}button.ic{background:transparent;color:var(--tx);padding:6px 8px;font-size:16px}.big{font-size:28px;font-weight:700;line-height:1.2}
.rt th,.rt td{padding:10px 6px}.chip{padding:2px 10px;border-radius:99px;font-size:13px;background:var(--bd)}.chip.win{background:var(--win)}.chip.loss{background:var(--loss)}
.gm{display:flex;align-items:center;gap:6px;margin:8px 0}.gm .sp{flex:1}.ch{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 14px}.ch.on{background:var(--pri);color:#fff;border-color:var(--pri)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}.sum{line-height:1.9;font-size:15px}tr.ok2{background:#10b98133}tr.mid{background:#f59e0b33}
.ph{width:130px;height:130px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,var(--bd),var(--card));border:1px dashed var(--bd)}
.nimg{flex-shrink:0;display:block}.nmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}.chip.new{background:#ef4444;color:#fff;font-weight:600}.chip.pin{background:#f59e0b;color:#fff}
.nt{color:var(--tx);text-decoration:none;font-size:16px}.nt:hover{text-decoration:underline}.nctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.nctl input{flex:1;min-width:180px}
.npg{display:flex;justify-content:center;align-items:center;gap:12px;margin:16px 0;flex-wrap:wrap}button:disabled{opacity:.4;cursor:default}.disc{font-size:12px;margin-top:20px}
.ndt{margin:10px 0 6px}.nhero img,.nhero .ph{width:100%;max-height:340px;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin:12px 0}.nhero .ph{height:200px;font-size:64px}
.nsum{white-space:pre-wrap;line-height:1.8;margin:12px 0}.notice{background:var(--bd);border-radius:10px;padding:10px 14px;font-size:13px;margin:12px 0}.nsrc{margin:12px 0;font-size:14px}
a.btn{display:inline-block;background:var(--pri);color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600}a.btn:hover{background:var(--pri2)}
.runbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#9ca3af}.dot.success{background:#10b981}.dot.partial{background:#f59e0b}.dot.error{background:#ef4444}.dot.running{background:#3b82f6}
@media(max-width:700px){.ph{width:86px;height:86px;font-size:28px}.nhero .ph{height:160px}}
.cat-products{--cc:#e8250f}.cat-campaigns{--cc:#0b8a1e}.cat-events{--cc:#1530e0}.cat-tournaments{--cc:#7c3aed}.cat-announcements{--cc:#0284c7}.cat-columns{--cc:#f2b100}.cat-others{--cc:#9ca3af}.cat-all{--cc:#222}
.card.news[class*="cat-"]{border-top:4px solid var(--cc)}.chip.tag{background:var(--cc);color:#fff;font-weight:600}.chip.tag.cat-columns{color:#222}
.ctabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0 12px}
.ctab{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-top:4px solid var(--cc);border-radius:6px;padding:12px 6px;font-weight:600}.ctab:hover{background:var(--bd)}.ctab.on{background:var(--cc);color:#fff;border-color:var(--cc)}.ctab.on.cat-columns{color:#222}
.chip.src{font-size:12px;border:1px solid var(--bd);background:var(--card)}.chip.src.pg{background:#1877f2;color:#fff;border-color:#1877f2}.chip.src.off{background:var(--card);color:var(--tx)}#nsrc{display:flex;flex-wrap:wrap;margin:8px 0}

/* G-Brain Design System — โหลดหลัง CSS เดิม แก้ธีมได้จาก :root จุดเดียว */
:root{
  --bg:#f5f3fb;--card:#fff;--tx:#1b1230;--mut:#6f6590;--bd:#e7e1f5;--pri:#7c3aed;--pri2:#6226d1;--nav:#120a1f;
  --pri-soft:#efe8fe;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--win:#d1fae5;--loss:#fee2e2;
  --r-sm:8px;--r:14px;--r-lg:20px;--sh:0 1px 2px #1b12300d,0 4px 14px #1b123010;--sh-up:0 8px 28px #1b123022;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--ease:cubic-bezier(.2,.7,.2,1);
  --grad:linear-gradient(135deg,#7c3aed,#9d5cff);--nav-w:240px}
@media(prefers-color-scheme:dark){:root{--bg:#0d0716;--card:#171025;--tx:#f3eeff;--mut:#a698c9;--bd:#2c2045;--pri:#8b5cf6;--pri2:#a78bfa;--nav:#0a0512;
  --pri-soft:#271a45;--win:#064e3b;--loss:#7f1d1d;--sh:0 1px 2px #0006,0 4px 14px #0004;--sh-up:0 10px 30px #0008}}
body{font-family:'IBM Plex Sans Thai','Prompt',system-ui,sans-serif;font-size:15.5px;line-height:1.6;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
h2{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin:0 0 var(--s4)}h3{font-size:1.1rem;font-weight:600}
a{color:var(--pri)}:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:var(--r-sm)}

/* ---- เมนู: แถบข้างสีเข้ม (เดสก์ท็อป) / แถบเลื่อนด้านบน (มือถือ) ---- */
nav{background:var(--nav);border-right:1px solid #ffffff10;color:#cfc4ea;padding:var(--s4) var(--s3)}
nav .brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3) var(--s4)}
nav .brand img{width:40px;height:40px;border-radius:12px;object-fit:cover}nav .brand b{color:#fff;font-size:1.15rem;letter-spacing:-.01em}
nav .sec{color:#8d7fb3;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:var(--s4) var(--s3) var(--s2);font-weight:600}
nav a{display:flex;align-items:center;gap:var(--s2);color:#cfc4ea;padding:9px var(--s3);border-radius:10px;font-weight:500;text-decoration:none;transition:background .15s,color .15s}
nav a:hover{background:#ffffff12;color:#fff}
nav a.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px #7c3aed55}
#fbadge{background:var(--err);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;margin-left:auto}

main{max-width:880px;margin:0 auto;padding:var(--s5) var(--s4) 72px}
.banner{border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:var(--s5)}

/* ---- การ์ด / ฟอร์ม / ปุ่ม ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:var(--s4) var(--s5);margin-bottom:var(--s3);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
input,textarea,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
button,a.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;min-height:44px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);transition:background .15s,transform .1s,box-shadow .15s}
button:hover,a.btn:hover{background:var(--pri2)}button:active,a.btn:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:not-allowed}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.ghost:hover{background:var(--pri-soft);border-color:var(--pri)}
button.ic{min-height:0;padding:4px 8px;background:transparent;color:var(--mut)}button.ic:hover{background:var(--pri-soft)}
.badge{background:var(--pri-soft);color:var(--pri);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}.badge.a{background:var(--grad);color:#fff}
.ok{color:var(--ok)}.bad{color:var(--err)}.mut{color:var(--mut)}
table{border-collapse:collapse;width:100%}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left}td,th{padding:10px 12px;border-bottom:1px solid var(--bd)}tr:hover td{background:var(--pri-soft)}
.card:has(>table),.tbl{overflow-x:auto}

/* ---- ข่าว ---- */
.card.news{padding:0;overflow:hidden;display:flex;gap:0}.card.news:hover{box-shadow:var(--sh-up);transform:translateY(-2px)}
.card.news .nb{padding:var(--s4) var(--s5)}.nt{color:var(--tx);font-size:1.08rem;line-height:1.4;text-decoration:none}.nt:hover{color:var(--pri)}
.nimg img,.nimg .ph{border-radius:0}.chip{border-radius:99px;font-size:12px;padding:2px 10px}
.ctab{border-radius:var(--r);font-weight:600;transition:transform .15s,background .15s}.ctab.on{box-shadow:var(--sh);transform:translateY(-1px)}
.ndet{padding:var(--s6)}.ndet h1,.ndet h2{font-size:1.9rem;line-height:1.3}.ndet p{max-width:68ch;line-height:1.8}

/* ---- ฟีด ---- */
.post{padding:var(--s4) var(--s5)}.pbar button{border-radius:99px;min-height:36px}
.post[data-pin="1"]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri),var(--sh)}
.post[data-pin="1"]::before{content:'📌 ปักหมุด';display:block;color:var(--pri);font-size:12px;font-weight:600;margin-bottom:var(--s2)}
.cb{border-radius:14px}.cmp-top textarea{min-height:84px}

/* ---- แชท ---- */
.chat{gap:var(--s3)}.chl,.chm{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh)}
.chi{border-radius:10px;transition:background .15s}.chi.on{background:var(--grad);color:#fff}
.chh{border-bottom:1px solid var(--bd);padding:var(--s3) var(--s4)}.live{font-size:12px;color:var(--mut)}.live.on{color:var(--ok)}
.msg .mtx{background:var(--bg);display:inline-block;padding:7px 13px;border-radius:4px 16px 16px 16px;max-width:min(100%,60ch);word-break:break-word}
.msg.own{flex-direction:row-reverse}.msg.own .mb{text-align:right;margin-left:auto}.msg.own .mh{justify-content:flex-end}
.msg.own .mtx{background:var(--pri);color:#fff;border-radius:16px 4px 16px 16px;text-align:left}.msg.own .mtx a{color:#fff;text-decoration:underline}
.mimg{border-radius:12px;max-width:min(320px,100%)}.chf{border-top:1px solid var(--bd);padding:var(--s3)}.chrow textarea{border-radius:22px}

/* ---- โปรไฟล์ / สถิติ ---- */
.prof .av.lg{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--pri)}.stat b{font-size:1.8rem;color:var(--pri)}.stat{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}

/* ---- Modal / Toast / Loading ---- */
.ov{background:#0a0512b3;backdrop-filter:blur(3px);animation:fade .18s}.md{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-up);animation:pop .22s var(--ease);max-width:min(560px,94vw);max-height:90vh;overflow:auto}
#toasts{position:fixed;right:var(--s4);bottom:var(--s4);display:flex;flex-direction:column;gap:var(--s2);z-index:99;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--nav);color:#fff;border-left:4px solid var(--pri);padding:12px 16px;border-radius:12px;box-shadow:var(--sh-up);animation:pop .25s var(--ease);transition:opacity .3s}.toast.out{opacity:0}
.card.mut:only-child{position:relative;overflow:hidden;min-height:72px}
.card.mut:only-child::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pri) 12%,transparent),transparent);animation:shim 1.2s infinite}
#app>*{animation:rise .28s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Responsive ---- */
@media(max-width:700px){
  nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:var(--s1);padding:var(--s2);position:sticky;top:0;z-index:20;border-right:0;border-bottom:1px solid #ffffff10;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}nav .brand{padding:0 var(--s2);flex-shrink:0}nav .brand b,nav .sec{display:none}nav a{white-space:nowrap;flex-shrink:0;padding:8px 12px}
  main{padding:var(--s3) var(--s3) 64px}.card{padding:var(--s3) var(--s4)}.ndet{padding:var(--s4)}
  .msg.own .mtx,.msg .mtx{max-width:100%}
}

/* ================= รอบ 2: จัดหน้าข่าว / ล็อกอิน / แอดมิน ================= */
h2::before{content:'';display:inline-block;width:5px;height:1.05em;border-radius:3px;background:var(--grad);margin-right:10px;vertical-align:-.15em}
.news .nimg{width:176px;flex-shrink:0;align-self:stretch;background:var(--bd)}
.news .nimg img,.news .nimg .ph{width:100%;height:100%;min-height:150px;border:0;border-radius:0;object-fit:cover;aspect-ratio:auto}.news .nimg .ph{font-size:44px}
#nl>.card.news:first-child{flex-direction:column}
#nl>.card.news:first-child .nimg{width:100%;height:280px}
#nl>.card.news:first-child .nt{font-size:1.45rem;-webkit-line-clamp:3}
#nl>.card.news:first-child .nb{padding:var(--s5)}
.news .nmeta{gap:6px;margin-bottom:var(--s2)}.news .clamp{color:var(--mut);margin:var(--s2) 0}.news .links{margin-top:var(--s2);font-size:13px}
.chip.new{background:var(--err)}.chip.pin{background:var(--warn)}
.pill{background:var(--pri-soft);border-radius:12px}.pill button{background:transparent;color:var(--mut);min-height:36px;padding:6px 16px}
.pill button:hover{background:transparent;color:var(--tx)}.pill button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.ctab{border-radius:10px}.nctl{margin:var(--s3) 0}
.card:has(#li){max-width:420px;margin:var(--s6) auto;padding:var(--s6);text-align:center}
.card:has(#li)::before{content:'';display:block;width:92px;height:92px;margin:0 auto var(--s3);background:url(assets/mascot.webp) center/contain no-repeat}

.admbar{background:var(--grad);border-radius:var(--r);box-shadow:var(--sh)}

<script>
document.getElementById('site').textContent=SITE;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//.test(u||'')?u:'';
let user=null,role='user',myProf=null;const isAdmin=()=>role=='admin';
const need=()=>user?false:(app.innerHTML='<div class="card">กรุณา <a href="#/login">Log In</a> ก่อน</div>',true);

// ---------- Login ----------
async function login(){
  if(user)return myAccount(); // หน้าบัญชี + โปรไฟล์: ดู community.js
  app.innerHTML=`<div class="card"><h2>Log In / Sign Up</h2><div class="row"><input id="em" placeholder="email"><input id="pw" type="password" placeholder="password (6+)"></div>
  <button id="li">Log In</button> <button id="su">Sign Up</button><p id="msg" class="mut"></p></div>`;
  const run=f=>async()=>{const{error}=await sb.auth[f]({email:$('#em').value,password:$('#pw').value});
    if(error)$('#msg').textContent=error.message;else if(f=='signUp')$('#msg').textContent='สมัครแล้ว (ถ้าเปิด email confirm ให้เช็คเมล)';};
  $('#li').onclick=run('signInWithPassword');$('#su').onclick=run('signUp');

// ---------- News ----------
const NCATS={products:'สินค้า',events:'อีเวนต์',tournaments:'การแข่งขัน',campaigns:'แคมเปญ',announcements:'ประกาศทั่วไป',columns:'คอลัมน์',others:'อื่น ๆ'};
const catTab=()=>`<div class="ctabs">${[['','ทั้งหมด'],...Object.entries(NCATS)].map(([k,v])=>`<button class="ctab cat-${k||'all'} ${nq.cat==k?'on':''}" data-c="${k}">${v}</button>`).join('')}</div>`;
const catOpts=(sel,all)=>(all?`<option value="">ทุกหมวดหมู่</option>`:'')+Object.entries(NCATS).map(([k,v])=>`<option value="${k}" ${k==sel?'selected':''}>${v}</option>`).join('');
const NEWS_COLS='id,title,original_title,summary,body,category,thumbnail_url,image_url,source_name,source_url,published_at,created_at,is_featured,ai_generated,fb_post_id,status';
const NEWS_PER=12;let nq={q:'',cat:'',src:'page',sort:'new',page:0};
const SRCS=[['page','ข่าวจากเพจ'],['','ทั้งหมด'],['official','ข่าวจาก Pokémon Asia']];
const srcTag=n=>n.source_name?'<span class="chip src off">Pokémon Asia</span>':'<span class="chip src pg">'+(n.fb_post_id?'เพจ Facebook':'ทีมงาน')+'</span>';
const nDate=n=>new Date(n.published_at||n.created_at);
const fmtDate=d=>d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const isNewNews=n=>Date.now()-nDate(n)<3*864e5;
const nImg=n=>{const u=n.thumbnail_url||n.image_url;return safeUrl(u)?`<img src="${esc(u)}" loading="lazy" alt="" referrerpolicy="no-referrer" data-img>`:`<div class="ph" aria-hidden="true">🃏</div>`};
const srcLabel=n=>n.fb_post_id?'ดูบน Facebook':(n.source_name?'อ่านประกาศต้นฉบับ':'แหล่งข่าว');
const DISCLAIMER='เว็บไซต์นี้เป็นเว็บไซต์ชุมชน ไม่ใช่เว็บไซต์ทางการของ Pokémon หรือ The Pokémon Company ข่าวที่แสดงเป็นการรวบรวมและสรุปจากแหล่งข่าวต้นทาง Pokémon และชื่อที่เกี่ยวข้องเป็นเครื่องหมายการค้าของเจ้าของสิทธิ์';
const fixImgs=root=>root.querySelectorAll('img[data-img]').forEach(i=>i.addEventListener('error',()=>{const d=document.createElement('div');d.className='ph';d.textContent='🃏';i.replaceWith(d)},{once:true}));

async function news(id){
  if(id)return newsDetail(id);
  app.innerHTML=`<h2>ข่าวสารจากเพจ</h2>`+(isAdmin()?`<div class="card"><input id="nt" placeholder="หัวข้อข่าว"> <input id="nu" placeholder="ลิงก์ต้นทาง https://..."> <select id="nc">${catOpts('announcements')}</select><textarea id="nb" placeholder="เนื้อหา"></textarea><button id="np">โพสต์</button></div>`:'')+
  `<div class="pill" id="nsrc">${SRCS.map(([k,v])=>`<button data-s="${k}" class="${nq.src==k?'on':''}">${v}</button>`).join('')}</div>${catTab()}<div class="nctl"><input id="nq" type="search" placeholder="ค้นหาจากชื่อเรื่อง…" value="${esc(nq.q)}"><select id="nsort"><option value="new" ${nq.sort=='new'?'selected':''}>ใหม่สุดก่อน</option><option value="old" ${nq.sort=='old'?'selected':''}>เก่าสุดก่อน</option></select></div><div id="nl"></div><div id="npg" class="npg"></div><p class="mut disc">${esc(DISCLAIMER)}</p>`;
  if(isAdmin())$('#np').onclick=async()=>{const title=$('#nt').value.trim();if(!title)return;const{error}=await sb.from('news').insert({title,body:$('#nb').value,source_url:$('#nu').value.trim()||null,category:$('#nc').value,status:'published'});if(error)alert(error.message);else news()};
  let t;$('#nq').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{nq.q=e.target.value.trim();nq.page=0;loadNews()},300)};
  app.querySelectorAll('#nsrc button').forEach(b=>b.onclick=()=>{nq.src=b.dataset.s;nq.page=0;app.querySelectorAll('#nsrc button').forEach(x=>x.classList.toggle('on',x==b));loadNews()});
  app.querySelectorAll('.ctab').forEach(b=>b.onclick=()=>{nq.cat=b.dataset.c;nq.page=0;app.querySelectorAll('.ctab').forEach(x=>x.classList.toggle('on',x==b));loadNews()});
  $('#nsort').onchange=e=>{nq.sort=e.target.value;nq.page=0;loadNews()};
  loadNews();
}
async function loadNews(){
  const box=$('#nl');if(!box)return;
  let q=sb.from('news').select(NEWS_COLS,{count:'exact'}).eq('status','published');
  if(nq.cat)q=q.eq('category',nq.cat);
  if(nq.src=='official')q=q.not('source_name','is',null);else if(nq.src=='page')q=q.is('source_name',null);
  if(nq.q)q=q.ilike('title',`%${nq.q.replace(/[\\%_]/g,'\\$&')}%`);
  q=nq.sort=='old'?q.order('published_at',{ascending:true}):q.order('is_featured',{ascending:false}).order('published_at',{ascending:false,nullsFirst:false});
  const{data,count,error}=await q.range(nq.page*NEWS_PER,nq.page*NEWS_PER+NEWS_PER-1);
  if(!$('#nl'))return; // ผู้ใช้ออกจากหน้าไปแล้ว
  if(error){box.innerHTML=`<div class="card bad">โหลดข่าวไม่สำเร็จ: ${esc(error.message)}</div>`;$('#npg').innerHTML='';return}
  const pages=Math.max(1,Math.ceil((count||0)/NEWS_PER));
  box.innerHTML=(data||[]).map(n=>`<div class="card news cat-${esc(n.category)}"><a href="#/news/${n.id}" class="nimg">${nImg(n)}</a><div class="nb">
    <div class="nmeta">${n.is_featured?'<span class="chip pin">📌 ปักหมุด</span>':''}${isNewNews(n)?'<span class="chip new">ใหม่</span>':''}${srcTag(n)}<span class="chip tag cat-${esc(n.category)}">${esc(NCATS[n.category]||NCATS.others)}</span><span class="mut">${fmtDate(nDate(n))}</span></div>
    <a href="#/news/${n.id}" class="nt"><b>${esc(n.title)}</b></a>
    <p class="clamp">${esc(n.summary||n.body||'')}</p>
    <div class="mut links"><a href="#/news/${n.id}">อ่านรายละเอียด</a>${safeUrl(n.source_url)?`<a href="${esc(n.source_url)}" target="_blank" rel="noopener noreferrer">${srcLabel(n)} ↗</a>`:''}${isAdmin()&&!n.source_name?`<a href="#" data-d="${n.id}">ลบ</a>`:''}</div></div></div>`).join('')||'<div class="card mut">ไม่พบข่าว</div>';
  fixImgs(box);
  box.querySelectorAll('[data-d]').forEach(a=>a.onclick=async e=>{e.preventDefault();if(confirm('ลบข่าวนี้?')){await sb.from('news').delete().eq('id',a.dataset.d);loadNews()}});
  $('#npg').innerHTML=pages>1?`<button class="ghost" id="pv" ${nq.page==0?'disabled':''}>← ก่อนหน้า</button><span class="mut">หน้า ${nq.page+1} / ${pages} (${count} ข่าว)</span><button class="ghost" id="nx" ${nq.page+1>=pages?'disabled':''}>ถัดไป →</button>`:`<span class="mut">${count||0} ข่าว</span>`;
  if(pages>1){$('#pv').onclick=()=>{nq.page--;loadNews();scrollTo({top:0})};$('#nx').onclick=()=>{nq.page++;loadNews();scrollTo({top:0})}}
}
async function newsDetail(id){
  app.innerHTML='<div class="card mut">กำลังโหลด…</div>';
  const{data:n}=await sb.from('news').select('*').eq('id',id).maybeSingle();
  if(!n){app.innerHTML='<p><a href="#/news">← กลับหน้าข่าว</a></p><div class="card bad">ไม่พบข่าวนี้ (อาจถูกซ่อนหรือลบแล้ว)</div>';return}
  const url=safeUrl(n.source_url),scraped=!!n.source_name,sum=n.summary||(scraped?'':n.body||'');
  app.innerHTML=`<p><a href="#/news">← กลับหน้าข่าว</a></p><article class="card ndet">
    <div class="nmeta">${n.is_featured?'<span class="chip pin">📌 ปักหมุด</span>':''}${isNewNews(n)?'<span class="chip new">ใหม่</span>':''}${srcTag(n)}<span class="chip tag cat-${esc(n.category)}">${esc(NCATS[n.category]||NCATS.others)}</span><span class="mut">เผยแพร่ ${fmtDate(nDate(n))}</span>${n.status!='published'?`<span class="chip">${esc(n.status)}</span>`:''}</div>
    <h2 class="ndt">${esc(n.title)}</h2>
    ${n.original_title&&n.original_title!=n.title?`<div class="mut">หัวข้อต้นฉบับ: ${esc(n.original_title)}</div>`:''}
    <div class="nhero">${nImg(n)}</div>
    ${sum?`<div class="nsum">${esc(sum)}</div>`:'<div class="nsum mut">ยังไม่มีสรุปภาษาไทยสำหรับข่าวนี้ กรุณาอ่านรายละเอียดจากประกาศต้นฉบับ</div>'}
    ${n.content?`<div class="nsum">${esc(n.content)}</div>`:''}
    ${scraped?`<div class="notice">ℹ️ ${n.ai_generated?'ข่าวนี้สรุปและเรียบเรียงโดย AI จากประกาศต้นฉบับ':'ข่าวนี้สรุปจากแหล่งข่าวต้นทาง'} ข้อมูลอาจคลาดเคลื่อนหรือไม่ครบถ้วน โปรดตรวจสอบรายละเอียดจากประกาศต้นฉบับ</div>`:''}
    <div class="nsrc">แหล่งที่มา: <b>${esc(n.source_name||(n.fb_post_id?'Facebook':'ทีมงาน'))}</b>${url?` · <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(new URL(url).hostname)}</a>`:''}</div>
    ${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${n.fb_post_id?'ดูโพสต์บน Facebook':'อ่านประกาศต้นฉบับ'} ↗</a>`:''}
    <p class="mut disc">${esc(DISCLAIMER)}</p></article>`;
  fixImgs(app);
}

// ---------- Battle Logs ----------
const norm=s=>(s||'').trim().toLowerCase();
const myName=()=>{try{return localStorage.getItem('myname')||''}catch(e){return ''}};
const setName=n=>{try{localStorage.setItem('myname',n)}catch(e){}};
function parseLog(raw){
  const players=[...new Set([...raw.matchAll(/^(.+?) drew 7 cards for the opening hand/gm)].map(m=>m[1].trim()))];
  if(players.length<2)[...raw.matchAll(/^Turn # \d+ - (.+?)['’]s Turn/gm)].forEach(m=>{const n=m[1].trim();if(!players.includes(n))players.push(n)});
  const wins=[...raw.matchAll(/(?:^|\.\s|\n)([^\n.]+?) wins\./g)].map(m=>m[1].trim());
  const conc=raw.match(/^(.+?) conceded/m);
  const turns=Math.max(0,...[...raw.matchAll(/Turn # (\d+)/g)].map(m=>+m[1]));
  return{players:players.slice(0,2),winner:wins.pop()||null,loser:conc?conc[1].trim():null,turns};
}
function guessDeck(raw,p){ // เดาชื่อเด็คจากโปเกมอนที่ลง/วิวัฒนาการ แก้ได้ในโหมด Edit logs
  const w={},e=p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),add=(n,v)=>{n=n.trim();if(n)w[n]=(w[n]||0)+v};
  for(const m of raw.matchAll(new RegExp('^'+e+' played (.+?) to the (?:Active Spot|Bench)','gm')))add(m[1],1);
  for(const m of raw.matchAll(new RegExp('^'+e+' evolved .+? to (.+?)\\.?$','gm')))add(m[1],2);
  return Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(' / ')||'Unknown';
}
const rec=L=>{const w=L.filter(x=>x.result=='win').length,l=L.filter(x=>x.result=='loss').length,t=L.length-w-l;return `${w}-${l}${t?'-'+t:''}`};
let ltab='day',lmax=30,ledit=false;
async function logs(){
  if(need())return;
  const{data}=await sb.from('battle_logs').select('id,my_deck,opp_deck,result,turns,created_at').order('created_at',{ascending:false}).limit(lmax);
  const L=data||[];
  app.innerHTML=`<div class="lh"><h2>Battle Logs</h2><span class="mut">บันทึกแมตช์ PTCG Live ของคุณ</span></div>
  <div class="card pastebox"><textarea id="raw" placeholder="วาง log จาก PTCG Live ที่นี่"></textarea><button id="add">＋ Add Log</button></div>
  <div class="mut" style="margin:-4px 0 12px">ชื่อในเกม: <b>${esc(myName())||'ยังไม่ตั้ง (จะถามตอนเพิ่ม log แรก)'}</b> · <a href="#" id="chn">เปลี่ยน</a></div>
  <div class="tabbar"><div class="pill">${[['day','Day'],['deck','Deck'],['all','All']].map(([k,l])=>`<button data-lt="${k}" class="${k==ltab?'on':''}">${l}</button>`).join('')}</div><button class="ghost" id="ed">${ledit?'✓ Done':'✏️ Edit logs'}</button></div><div id="lg"></div>`;
  const inp=(l,f)=>ledit?`<input class="mini" data-f="${f}" data-id="${l.id}" value="${esc(l[f])}">`:esc(l[f]);
  const row=l=>`<div class="lrow ${l.result}"><div><b>${l.result=='win'?'Win':l.result=='loss'?'Loss':'Tie'}</b> vs ${inp(l,'opp_deck')}<div class="mut">${inp(l,'my_deck')} · ${l.turns} turns · ${new Date(l.created_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</div></div>${ledit?`<button class="ghost" data-del="${l.id}">🗑</button>`:''}</div>`;
  const group=(t,items,open=true,empty='ยังไม่มีแมตช์ที่บันทึก<br>ออกไปเล่นกันเลย!')=>`<div class="grp"><div class="gh"><b>${esc(t)}</b><span><b>${rec(items)}</b> <span class="mut">${items.length} total</span> ▾</span></div><div class="gb" ${open?'':'hidden'}>${items.map(row).join('')||`<p class="mut">${empty}</p>`}</div></div>`;
  const dk=d=>new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  let out='';
  if(ltab=='day'){const g={};g[dk(Date.now())]=[];L.forEach(l=>(g[dk(l.created_at)]??=[]).push(l));
    out=Object.entries(g).map(([k,v],i)=>group(k,v,true,i==0?'วันนี้ยังไม่มีแมตช์ที่บันทึก<br>ออกไปเล่นกันเลย!':undefined)).join('')}
  else if(ltab=='deck'){const g={};L.forEach(l=>(g[l.my_deck||'Unknown']??=[]).push(l));
    out=Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>group(`${k} · ${Math.round(v.filter(x=>x.result=='win').length/v.length*100)}%`,v,false)).join('')||'<p class="mut">ยังไม่มีข้อมูล</p>'}
  else out=group('ทั้งหมด',L);
  $('#lg').innerHTML=out+(L.length>=lmax?'<div style="text-align:center;margin:16px"><button class="ghost" id="more">โหลด log เก่ากว่านี้</button></div>':'');
  $('#add').onclick=async()=>{
    const raw=$('#raw').value.trim();if(!raw)return;const p=parseLog(raw);
    if(p.players.length<2)return alert('อ่าน log ไม่ได้: ไม่พบรายชื่อผู้เล่น ลองคัดลอก log ทั้งหมดจาก PTCG Live ใหม่');
    let me=p.players.find(x=>norm(x)==norm(myName()));
    if(!me){me=confirm(`ใน log มีผู้เล่น:\n1) ${p.players[0]}\n2) ${p.players[1]}\n\nกด OK ถ้าคุณคือ "${p.players[0]}"\nกด Cancel ถ้าคุณคือ "${p.players[1]}"`)?p.players[0]:p.players[1];setName(me)}
    const opp=p.players.find(x=>x!=me);
    const result=p.winner?(norm(p.winner)==norm(me)?'win':'loss'):p.loser?(norm(p.loser)==norm(me)?'loss':'win'):'tie';
    const{error}=await sb.from('battle_logs').insert({my_deck:guessDeck(raw,me),opp_deck:guessDeck(raw,opp),result,turns:p.turns,raw});
    if(error)return alert(error.message);logs()};
  $('#chn').onclick=e=>{e.preventDefault();const n=prompt('ชื่อในเกม PTCG Live ของคุณ',myName());if(n!==null){setName(n.trim());logs()}};
  app.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{ltab=b.dataset.lt;logs()});
  $('#ed').onclick=()=>{ledit=!ledit;logs()};
  if($('#more'))$('#more').onclick=()=>{lmax+=30;logs()};
  app.querySelectorAll('.gh').forEach(g=>g.onclick=()=>g.nextElementSibling.toggleAttribute('hidden'));
  app.querySelectorAll('[data-f]').forEach(i=>i.onchange=async()=>{await sb.from('battle_logs').update({[i.dataset.f]:i.value}).eq('id',i.dataset.id)});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('ลบแมตช์นี้?')){await sb.from('battle_logs').delete().eq('id',b.dataset.del);logs()}});
}

// ---------- Cut Calculator ----------
const recRounds=n=>n<=8?3:n<=16?4:n<=32?5:n<=64?6:n<=128?7:n<=226?8:n<=409?9:10;
const binC=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};
const fieldDist=(P,R)=>Array.from({length:R+1},(_,w)=>P*binC(R,w)/2**R);
function pTop(cnt,me,N){let ab=0,eq=0;cnt.forEach((c,w)=>{if(3*w>me)ab+=c;else if(3*w==me)eq+=c});return ab>=N?0:ab+eq+1<=N?1:(N-ab)/(eq+1)}
function cutTable(P,R,N){let cum=0;return Array.from({length:R+1},(_,i)=>{const w=R-i,c=P*binC(R,w)/2**R,p=Math.max(0,Math.min(1,(N-cum)/c)),r={w,l:R-w,c,p};cum+=c;return r})}
async function swiss(){
  app.innerHTML=`<h2>🧮 ตัวช่วยคำนวณ Cut</h2><p class="mut">ใส่จำนวนผู้เล่น จำนวนรอบ และ Cut Top เพื่อดูว่าต้องจบ record เท่าไหร่ถึงจะเข้ารอบ</p>
  <div class="card"><div class="row two"><label>จำนวนผู้เล่น<input id="c_p" type="number" min="2" value="64"></label><label>จำนวนรอบ <span id="c_rec"></span><input id="c_r" type="number" min="1" value="6"></label><label>Cut Top<input id="c_n" type="number" min="1" value="8"></label></div></div>
  <div id="c_sum"></div><div class="card" style="overflow:auto" id="c_tb"></div>
  <div class="card"><b>ตอนนี้ฉันอยู่ที่…</b> <span class="mut">(ไม่บังคับ — ดูว่ายังมีลุ้นไหม)</span><div class="row two"><label>ชนะ<input id="c_w" type="number" min="0" placeholder="0"></label><label>แพ้<input id="c_l" type="number" min="0" placeholder="0"></label><label>เสมอ/ID<input id="c_t" type="number" min="0" placeholder="0"></label></div><div id="c_me"></div></div>
  <p class="mut">สมมติว่าทุกแมตช์ชนะ 50/50 และจับคู่ Swiss ตามปกติ เป็นค่าประมาณ ผลจริงขึ้นกับจำนวน ID/เสมอ และ tiebreak (OWP)</p>`;
  let manual=false;const g=i=>+$(i).value||0;
  const run=()=>{
    const P=g('#c_p'),R=g('#c_r'),N=g('#c_n');
    $('#c_rec').textContent=P>1?`(แนะนำ ${recRounds(P)})`:'';
    if(P<2||R<1||N<1){$('#c_sum').innerHTML=$('#c_tb').innerHTML=$('#c_me').innerHTML='';return}
    const T=cutTable(P,R,N),safe=T.filter(r=>r.p>=.999).pop(),mid=T.filter(r=>r.p>0&&r.p<.999),out=T.some(r=>r.p==0);
    $('#c_sum').innerHTML=`<div class="card sum">${N>=P?'Cut มากกว่าหรือเท่ากับจำนวนผู้เล่น — ทุกคนเข้ารอบ':
      `${P} คน · ${R} รอบ · Cut Top ${N}<br>${safe?`✅ จบ <b>${safe.w}-${safe.l}</b> หรือดีกว่า (${3*safe.w} แต้ม) → ติดแน่นอน`:'⚠️ ไม่มี record ไหนการันตี'}`+
      mid.map(r=>`<br>⚠️ จบ <b>${r.w}-${r.l}</b> → ติดประมาณ <b>${Math.round(r.p*100)}%</b> (ขึ้นกับ tiebreak)`).join('')+(out?'<br>❌ ต่ำกว่านั้นไม่ติด':'')}</div>`;
    $('#c_tb').innerHTML=`<table><tr><th>Record</th><th>แต้ม</th><th>คนที่คาดว่าจะจบ</th><th>โอกาสติด Top ${N}</th></tr>${T.map(r=>`<tr class="${r.p>=.999?'ok2':r.p>0?'mid':''}"><td><b>${r.w}-${r.l}</b></td><td>${3*r.w}</td><td>${r.c<10?r.c.toFixed(1):Math.round(r.c)}</td><td>${r.p>=.999?'ติดแน่นอน':r.p>0?'≈ '+Math.round(r.p*100)+'%':'—'}</td></tr>`).join('')}</table>`;
    const w=g('#c_w'),l=g('#c_l'),t=g('#c_t'),d=w+l+t;
    if(!d){$('#c_me').innerHTML='';return}
    if(d>R){$('#c_me').innerHTML='<p class="bad">จำนวนรอบที่เล่นเกินจำนวนรอบทั้งหมด</p>';return}
    const mk=x=>({games:[{res:x}]}),rounds=[...Array(w).fill(mk('W')),...Array(l).fill(mk('L')),...Array(t).fill(mk('T'))];
    const o=cutOdds({rounds,players:P,total_rounds:R,cut:N}),need=o.rows.find(r=>r.p>=.5),any=o.rows.find(r=>r.p>0);
    $('#c_me').innerHTML=`<p style="margin:10px 0 4px">${w}-${l}${t?'-'+t:''} · เหลืออีก ${o.rem} รอบ · โอกาสโดยรวม ≈ <b>${Math.round(o.overall*100)}%</b></p>
    <p class="mut" style="margin:0 0 8px">${!any?'หมดลุ้นแล้ว':need?`ต้องชนะอีกอย่างน้อย <b>${need.k}</b> รอบ ถึงจะมีโอกาสเกิน 50%`:`ต้องชนะให้หมด ${any.k>0?'อย่างน้อย '+any.k+' รอบ':''} จึงจะมีลุ้น`}</p>
    ${o.rem?`<table>${o.rows.map(r=>`<tr><td>ชนะอีก ${r.k}/${o.rem} รอบ → จบ ${w+r.k}-${l+o.rem-r.k}${t?'-'+t:''}</td><td><b>${Math.round(r.p*100)}%</b></td></tr>`).join('')}</table>`:''}`;
  };
  ['c_p','c_r','c_n','c_w','c_l','c_t'].forEach(id=>$('#'+id).oninput=()=>{if(id=='c_r')manual=true;if(id=='c_p'&&!manual)$('#c_r').value=recRounds(g('#c_p'));run()});
  run();
}

function cutOdds(t){ // คิดแบบเฉลี่ย: ผู้เล่นคนอื่นชนะ 50/50 ทุกรอบ
  const R=t.rounds||[],rem=Math.max(0,t.total_rounds-R.length),pts=R.reduce((s,r)=>s+{win:3,tie:1,loss:0}[rres(r)],0),cnt=fieldDist(t.players-1,t.total_rounds);
  const rows=Array.from({length:rem+1},(_,k)=>({k,p:pTop(cnt,pts+3*k,t.cut)}));
  return{rows,overall:rows.reduce((a,r)=>a+binC(rem,r.k)/2**rem*r.p,0),rem,pts};
}

    ${lastOk?`<div class="mut">ตรวจสำเร็จล่าสุด: ${fmtDT(lastOk.started_at)}${stale?' <b class="bad">⚠ นานเกิน 3 ชั่วโมง ตรวจสอบ GitHub Actions</b>':''}</div>`:''}
    ${last&&last.error?`<div class="bad" style="margin-top:6px">ข้อผิดพลาด: ${esc(last.error)}</div>`:''}
    ${last&&last.details&&last.details.problems&&last.details.problems.length?`<details><summary class="mut">รายละเอียดปัญหา (${last.details.problems.length})</summary><pre class="mut">${esc(last.details.problems.join('\n'))}</pre></details>`:''}
    ${(runs||[]).length>1?`<details><summary class="mut">ประวัติ 5 รอบล่าสุด</summary><table>${runs.map(r=>`<tr><td>${runBadge(r)}</td><td class="mut">${fmtDT(r.started_at)}</td><td class="mut">+${r.inserted??0}</td></tr>`).join('')}</table></details>`:''}
    <hr style="border:0;border-top:1px solid var(--bd);margin:12px 0">
    <div class="row"><button id="sn">🔄 สั่งตรวจสอบข่าวใหม่</button><span class="mut" id="snm">${typeof S.manual_requested_at=='string'?'มีคำขอรออยู่ (ส่งเมื่อ '+fmtDT(S.manual_requested_at)+')':''}</span></div>
    <div class="row"><label>ช่วงตรวจสอบ (นาที, 30–1440)<input id="si" type="number" min="30" max="1440" step="5" value="${Number(S.interval_minutes)||30}"></label>
      <label style="justify-content:flex-end"><span><input type="checkbox" id="sa" ${S.ai_enabled!==false?'checked':''}> เปิด AI สรุปข่าว</span></label>
      <label style="justify-content:flex-end"><span><input type="checkbox" id="sp" ${S.auto_publish!==false?'checked':''}> เผยแพร่ข่าวที่ดึงมาอัตโนมัติ</span></label>
      <button id="ss" class="ghost">บันทึกการตั้งค่า</button></div>
    <div class="mut">Scraper รันบน GitHub Actions ทุก 30 นาที — คำขอสั่งตรวจเองจะถูกประมวลผลในรอบถัดไป (หรือกด Run workflow ใน GitHub เพื่อรันทันที) · การเปิด AI ต้องตั้ง AI_ENABLED และ AI_API_KEY ฝั่ง Scraper ด้วย</div></div>
    <div class="row"><select id="afs"><option value="">ทุกสถานะ</option>${['published','pending','hidden'].map(x=>`<option ${anf.status==x?'selected':''}>${x}</option>`).join('')}</select><select id="afc">${catOpts(anf.cat,1)}</select><a href="#/news" class="mut" style="align-self:center">+ โพสต์ข่าวเองที่หน้าข่าวสาร</a></div><div id="anl"></div>`;
  $('#sn').onclick=async()=>{const{error}=await sb.from('scraper_settings').upsert({key:'manual_requested_at',value:new Date().toISOString(),updated_at:new Date().toISOString()});$('#snm').textContent=error?error.message:'ส่งคำขอแล้ว — จะทำงานในรอบถัดไป'};
  $('#ss').onclick=async()=>{const iv=Math.round(Number($('#si').value));if(!(iv>=30&&iv<=1440)){alert('ช่วงตรวจสอบต้อง 30–1440 นาที');return}
    const now=new Date().toISOString(),{error}=await sb.from('scraper_settings').upsert([{key:'interval_minutes',value:iv,updated_at:now},{key:'ai_enabled',value:$('#sa').checked,updated_at:now},{key:'auto_publish',value:$('#sp').checked,updated_at:now}]);
    $('#snm').textContent=error?error.message:'บันทึกแล้ว'};
  $('#afs').onchange=e=>{anf.status=e.target.value;adminNews(box)};$('#afc').onchange=e=>{anf.cat=e.target.value;adminNews(box)};
  let q=sb.from('news').select('id,title,summary,category,status,is_featured,source_name,source_url,published_at,created_at').order('published_at',{ascending:false,nullsFirst:false}).limit(100);
  if(anf.status)q=q.eq('status',anf.status);if(anf.cat)q=q.eq('category',anf.cat);
  const{data}=await q,rows=data||[];
  $('#anl').innerHTML=`<div class="card" style="overflow:auto"><table>${rows.map(n=>`<tr><td>${n.is_featured?'📌 ':''}<b>${esc(n.title)}</b><div class="mut">${esc(NCATS[n.category]||'')} · ${n.source_name?'ดึงอัตโนมัติ':'โพสต์เอง/FB'}${n.summary?'':' · <span class="bad">ไม่มีสรุป</span>'}</div></td>
    <td><span class="chip">${esc(n.status)}</span></td><td class="mut">${fmtDate(nDate(n))}</td>
    <td style="white-space:nowrap"><button class="ic" title="แก้ไข" data-e="${n.id}">✏️</button><button class="ic" title="${n.status=='published'?'ซ่อน':'เผยแพร่'}" data-v="${n.id}" data-s="${n.status=='published'?'hidden':'published'}">${n.status=='published'?'🙈':'👁️'}</button><button class="ic" title="ปักหมุด" data-p="${n.id}" data-f="${n.is_featured?0:1}">${n.is_featured?'📍':'📌'}</button><button class="ic" title="ลบ" data-x="${n.id}">🗑️</button></td></tr>`).join('')||'<tr><td class="mut">ไม่มีข่าว</td></tr>'}</table></div>`;
  const byId=id=>rows.find(r=>r.id==id),upd=async(id,patch)=>{const{error}=await sb.from('news').update(patch).eq('id',id);if(error)alert(error.message);adminNews(box)};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>upd(b.dataset.v,{status:b.dataset.s}));
  box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>upd(b.dataset.p,{is_featured:b.dataset.f=='1'}));
  box.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const n=byId(b.dataset.x);if(confirm(`ลบข่าว "${n.title}"?`+(n.source_name?'\n(ข่าวที่ดึงอัตโนมัติจะไม่ถูกดึงกลับมาอีก)':''))){const{error}=await sb.from('news').delete().eq('id',n.id);if(error)alert(error.message);adminNews(box)}});
  box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const n=byId(b.dataset.e);
    const m=document.createElement('div');m.className='ov';
    m.innerHTML=`<div class="md"><b>แก้ไขข่าว</b><label>หัวข้อ<input id="et" value="${esc(n.title)}"></label><label>หมวดหมู่<select id="ec">${catOpts(n.category)}</select></label><label>สรุป<textarea id="es" style="min-height:160px">${esc(n.summary||'')}</textarea></label><div class="row end"><button class="soft" id="ex">ยกเลิก</button><button id="eo">บันทึก</button></div></div>`;
    document.body.appendChild(m);m.querySelector('#ex').onclick=()=>m.remove();
    m.querySelector('#eo').onclick=async()=>{const t=m.querySelector('#et').value.trim();if(!t)return;m.remove();await upd(n.id,{title:t,category:m.querySelector('#ec').value,summary:m.querySelector('#es').value.trim()||null})}});
}

// ---------- Admin ----------
let atab='overview';
async function admin(){
  if(need())return;
  if(!isAdmin()){app.innerHTML='<div class="card bad">หน้านี้สำหรับผู้ดูแลระบบเท่านั้น</div>';return}
  const tabs=[['overview','ภาพรวม'],['users','สมาชิก'],['community','ช่องแชท'],['news','ข่าว'],['tours','ทัวร์']];
  app.innerHTML=`<div class="admbar">🛡️ Admin Panel</div><div class="row">${tabs.map(([k,l])=>`<button data-t="${k}" class="${k==atab?'':'ghost'}">${l}</button>`).join('')}</div><div id="ab"></div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{atab=b.dataset.t;admin()});
  const box=$('#ab');
  if(atab=='overview'){const{data:s}=await sb.rpc('admin_stats');
    box.innerHTML=`<div class="grid">${[['สมาชิก','users'],['โพสต์','posts'],['ข้อความแชท','messages'],['Battle Logs','logs'],['ทัวร์','tournaments'],['ข่าว','news']].map(([l,k])=>`<div class="card stat"><b>${s?.[k]??0}</b><span class="mut">${l}</span></div>`).join('')}</div>`}
  else if(atab=='users')await adminMembers(box);
  else if(atab=='community')await adminCommunity(box);
  else if(atab=='news')await adminNews(box);
  else{const[tb,col]={tours:['tournaments','name']}[atab];
    const{data}=await sb.from(tb).select(`id,${col},created_at`).order('created_at',{ascending:false});
    box.innerHTML=`<div class="card"><table>${(data||[]).map(r=>`<tr><td>${esc(r[col])}</td><td class="mut">${new Date(r.created_at).toLocaleDateString()}</td><td><button data-x="${r.id}">ลบ</button></td></tr>`).join('')||'<tr><td class="mut">ไม่มีข้อมูล</td></tr>'}</table></div>`;
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('ลบรายการนี้?')){await sb.from(tb).delete().eq('id',b.dataset.x);admin()}})}
}

// ---------- Router ----------
const pages={news,feed,chat,dm,friends,u:profilePage,logs,tours,login,admin,swiss,stats};
async function go(){chatLeave();document.querySelectorAll('.ov').forEach(o=>o.remove());const[p,id]=(location.hash.slice(2)||'news').split('/');$('main').classList.toggle('wide',p=='chat'||p=='dm');$('#banner').style.display=(p=='news'||!pages[p])?'block':'none';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+(pages[p]?p:'news')));await(pages[p]||news)(id)}
sb.auth.onAuthStateChange((_,s)=>{user=s?.user||null;
  setTimeout(async()=>{role='user';myProf=null;
    if(user){const{data}=await sb.from('profiles').select('role,display_name,avatar_url,bio,banned').eq('id',user.id).maybeSingle();myProf=data;role=data?.role||'user'}
    $('#auth').textContent=user?'👤 บัญชีของฉัน':'🔑 Log In';
    document.querySelectorAll('.adm').forEach(e=>e.style.display=isAdmin()?'block':'none');refreshFriendBadge();go()},0)});
addEventListener('hashchange',go);
</script>
<script>/* toast แทน alert (ไม่บล็อกหน้า) — ฟังก์ชันเดิมที่เรียก alert() ใช้ได้ตามเดิม */
(()=>{const box=document.createElement('div');box.id='toasts';box.setAttribute('role','status');box.setAttribute('aria-live','polite');document.body.appendChild(box);
window.alert=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;box.appendChild(t);setTimeout(()=>t.classList.add('out'),3200);setTimeout(()=>t.remove(),3600)}})();
</script></body></html>
